name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            libstdc++6

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Cache pip and Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ./.buildozer
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Cython==0.29.33" "buildozer==1.4.2" "python-for-android"

      - name: Accept Android SDK licenses
        run: |
          echo "y" | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
          echo "APP_ANDROID_ACCEPT_SDK_LICENSE=1" >> $GITHUB_ENV

      - name: Prepare signing keystore (Release only)
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
          echo "P4A_RELEASE_KEYSTORE=keystore.jks" >> $GITHUB_ENV
          echo "P4A_RELEASE_KEYSTORE_PASS=${{ secrets.SIGNING_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "P4A_RELEASE_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "P4A_RELEASE_KEY_PASS=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Set version from Git tag (or fallback)
        run: |
          if [[ $GITHUB_REF_TYPE == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "VERSION=${VERSION#v}" >> $GITHUB_ENV
          else
            echo "VERSION=0.1.0-dev" >> $GITHUB_ENV
          fi
          echo "Version set to: $VERSION"

      - name: Build APK (Debug or Release)
        run: |
          # Update buildozer.spec dynamically for version & arch
          sed -i "s/^version = .*/version = ${{ env.VERSION }}/" buildozer.spec || true
          
          if [[ "${{ github.ref_type }}" == "tag" || "${{ inputs.build_type }}" == "release" ]]; then
            buildozer -v android release
          else
            buildozer -v android debug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ env.VERSION }}-${{ (github.ref_type == 'tag' || inputs.build_type == 'release') && 'release' || 'debug' }}
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
